# Actualiza los datos una vez al día y los guarda en docs/data.
# GitHub Pages (configurado para publicar la carpeta docs/ de la rama main) vuelve a publicar la página
# con cada cambio.
name: Actualizar datos

on:
  schedule:
    - cron: "0 15 * * *"  # 10:00 hora de Perú; el MEF publica el archivo diario hacia las 8:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/test_gasto_mef.py
      - run: python scripts/gasto_mef.py
      # Infobras y SUSALUD no responden a los servidores de GitHub (tiempo agotado en todas las ejecuciones desde el
      # 30/10/2026): se actualizan desde una computadora con scripts/actualizar_local.sh (ver docs/actualizacion_local.md).
      # inversiones_mef.py usa los CUI de docs/data/infobras_piura.json tal como está en el repositorio.
      - run: python scripts/inversiones_mef.py
      # Pasos opcionales: si una fuente falla, se conservan sus datos anteriores (con su propia fecha) y el resto
      # sigue. El último paso informa cuáles fallaron y hace fallar la ejecución para que GitHub avise por correo.
      - id: fen
        run: python scripts/fen_mef.py
        continue-on-error: true
      - id: ipc
        run: python scripts/ipc_inei.py  # dato mensual: solo descarga el informe del INEI si hay uno nuevo
        continue-on-error: true
      - run: python scripts/historial.py
      - name: Guardar datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Actualiza datos $(date -u +%F)"
          git pull --rebase && git push
      - name: Revisar pasos opcionales
        if: always()
        env:
          FEN: ${{ steps.fen.outcome }}
          IPC: ${{ steps.ipc.outcome }}
        run: |
          fallidos=0
          {
            echo "## Fuentes opcionales"
            echo ""
            echo "| Fuente | Script | Resultado |"
            echo "| --- | --- | --- |"
            for f in "Emergencia FEN (MEF)|fen_mef.py|$FEN" "IPC (INEI)|ipc_inei.py|$IPC"; do
              IFS="|" read -r nombre script resultado <<< "$f"
              case "$resultado" in
                success) txt="correcto" ;;
                failure) txt="**falló**: se conservan los datos anteriores"; fallidos=$((fallidos + 1)) ;;
                *) txt="no se ejecutó ($resultado)" ;;
              esac
              echo "| $nombre | \`$script\` | $txt |"
            done
            echo ""
            echo "Infobras y SUSALUD (camas) se actualizan a mano con \`scripts/actualizar_local.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fallidos" -gt 0 ]; then
            echo "::error::$fallidos fuente(s) opcional(es) fallaron; ver el resumen de la ejecución."
            exit 1
          fi

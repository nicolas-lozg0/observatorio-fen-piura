# Actualiza los datos una vez al día y los guarda en docs/data.
# GitHub Pages (configurado para publicar la carpeta docs/ de la rama main) vuelve a publicar la página
# con cada cambio.
name: Actualizar datos

on:
  schedule:
    # Dos corridas, en minutos que no son en punto: a la hora en punto GitHub se atrasa 4 a 9 horas (noviembre de 2026).
    # El MEF publica el archivo diario hacia las 8:30; si a la 2.ª corrida no cambió, gasto_mef.py no lo vuelve a leer.
    # Los ríos también ganan: dos lecturas al día de una ventana de 24 h dejan menos huecos.
    - cron: "17 14 * * *"  # 9:17 hora de Perú
    - cron: "7 18 * * *"   # 13:07 hora de Perú
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/test_gasto_mef.py
      # Censo 2025 por manzana: archivo fijo (censo_inei.py se corre a mano); se revisa que siga sano
      - run: python scripts/test_censo_inei.py
      - run: python scripts/test_clima.py
      - run: python scripts/gasto_mef.py
      # Infobras y SUSALUD no responden a los servidores de GitHub (tiempo agotado en todas las ejecuciones desde el
      # 30/10/2026): se actualizan desde una computadora con scripts/actualizar_local.sh (ver scripts/actualizacion_local.md).
      # inversiones_mef.py usa los CUI de docs/data/infobras_piura.json tal como está en el repositorio.
      - run: python scripts/inversiones_mef.py
      # Pasos opcionales: si una fuente falla, se conservan sus datos anteriores (con su propia fecha) y el resto
      # sigue. El último paso informa cuáles fallaron y hace fallar la ejecución para que GitHub avise por correo.
      - id: fen
        run: python scripts/fen_mef.py
        continue-on-error: true
      - id: ipc
        run: python scripts/ipc_inei.py  # dato mensual: solo descarga el informe del INEI si hay uno nuevo
        continue-on-error: true
      # Clima: lluvia (Senamhi), temperatura del mar (NOAA) y estado del ENFEN. Senamhi y ENFEN son servidores del
      # Estado peruano: si no responden a GitHub, como Infobras y SUSALUD, se verá aquí.
      - id: lluvia
        run: python scripts/lluvia_senamhi.py
        continue-on-error: true
      - id: tsm
        run: python scripts/tsm_paita.py
        continue-on-error: true
      - id: nino12
        run: python scripts/nino12_cpc.py
        continue-on-error: true
      # Temperatura del aire (ERA5-Land vía Open-Meteo, sin clave) y nivel de los ríos (Senamhi: solo 24 h, se acumula)
      - id: temperatura
        run: python scripts/temperatura_piura.py
        continue-on-error: true
      - id: rios
        run: python scripts/rios_senamhi.py
        continue-on-error: true
      # No escribe datos: falla si el ENFEN publicó un comunicado más reciente que docs/data/enfen_comunicado.json
      - id: enfen
        run: python scripts/enfen.py
        continue-on-error: true
      - name: Guardar datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Actualiza datos $(date -u +%F)"
          # GitHub a veces rechaza el push con un error interno pasajero: hasta 3 intentos
          for i in 1 2 3; do
            git pull --rebase && git push && break
            [ "$i" = 3 ] && exit 1
            echo "Push falló (intento $i de 3); nuevo intento en $((15 * i)) s"; sleep $((15 * i))
          done
      - name: Revisar pasos opcionales
        if: always()
        env:
          FEN: ${{ steps.fen.outcome }}
          IPC: ${{ steps.ipc.outcome }}
          LLUVIA: ${{ steps.lluvia.outcome }}
          TSM: ${{ steps.tsm.outcome }}
          NINO12: ${{ steps.nino12.outcome }}
          ENFEN: ${{ steps.enfen.outcome }}
          TEMPERATURA: ${{ steps.temperatura.outcome }}
          RIOS: ${{ steps.rios.outcome }}
        run: |
          fallidos=0
          {
            echo "## Fuentes opcionales"
            echo ""
            echo "| Fuente | Script | Resultado |"
            echo "| --- | --- | --- |"
            for f in "Emergencia FEN (MEF)|fen_mef.py|$FEN" "IPC (INEI)|ipc_inei.py|$IPC" "Lluvia (Senamhi)|lluvia_senamhi.py|$LLUVIA" \
                     "Temperatura del mar (NOAA)|tsm_paita.py|$TSM" "Niño 1+2 semanal (NOAA CPC)|nino12_cpc.py|$NINO12" \
                     "Temperatura del aire (ERA5-Land, Open-Meteo)|temperatura_piura.py|$TEMPERATURA" \
                     "Nivel de los ríos (Senamhi, se acumula)|rios_senamhi.py|$RIOS" \
                     "Aviso de comunicado nuevo del ENFEN (falla = hay que actualizar el JSON a mano)|enfen.py|$ENFEN"; do
              IFS="|" read -r nombre script resultado <<< "$f"
              case "$resultado" in
                success) txt="correcto" ;;
                failure) txt="**falló**: se conservan los datos anteriores"; fallidos=$((fallidos + 1)) ;;
                *) txt="no se ejecutó ($resultado)" ;;
              esac
              echo "| $nombre | \`$script\` | $txt |"
            done
            echo ""
            echo "Infobras y SUSALUD (camas) se actualizan a mano con \`scripts/actualizar_local.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fallidos" -gt 0 ]; then
            echo "::error::$fallidos fuente(s) opcional(es) fallaron; ver el resumen de la ejecución."
            exit 1
          fi

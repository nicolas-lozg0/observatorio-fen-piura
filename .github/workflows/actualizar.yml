# Actualiza los datos una vez al día y los guarda en docs/data.
# GitHub Pages (configurado para publicar la carpeta docs/ de la rama main) vuelve a publicar la página
# con cada cambio.
name: Actualizar datos

on:
  schedule:
    - cron: "0 15 * * *"  # 10:00 hora de Perú; el MEF publica el archivo diario hacia las 8:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/test_gasto_mef.py
      - run: python scripts/gasto_mef.py
      # Si una fuente secundaria falla, se conservan sus datos anteriores (con su propia fecha)
      - run: python scripts/infobras.py  # antes de inversiones_mef.py, que usa sus CUI
        continue-on-error: true
      - run: python scripts/inversiones_mef.py
      - run: python scripts/fen_mef.py
        continue-on-error: true
      - run: python scripts/camas_susalud.py  # dato mensual: vuelve a leer el último mes publicado
        continue-on-error: true
      - run: python scripts/historial.py
      - name: Guardar datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Actualiza datos $(date -u +%F)"
          git pull --rebase && git push

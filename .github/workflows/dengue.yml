# Dengue 2026: lee cada semana la sala situacional de la DIRESA Piura (PDF) y guarda docs/data/dengue_2026.json.
# La DIRESA suele publicar la sala los jueves; si aún no hay una nueva, el script no cambia nada.
name: Actualizar dengue

on:
  schedule:
    - cron: "0 16 * * 5"  # viernes, 11:00 hora de Perú
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dengue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/test_dengue.py
      - run: python scripts/dengue_diresa.py
      - name: Guardar datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Actualiza dengue $(date -u +%F)"
          # GitHub a veces rechaza el push con un error interno pasajero: hasta 3 intentos
          for i in 1 2 3; do
            git pull --rebase && git push && break
            [ "$i" = 3 ] && exit 1
            echo "Push falló (intento $i de 3); nuevo intento en $((15 * i)) s"; sleep $((15 * i))
          done
